{% extends "base.html" %}

{% block title %}Academy Enrollment | Kusmus{% endblock %}

{% block content %}
<style>
    .apply-container {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        position: relative;
        z-index: 10;
        overflow-y: auto;
    }

    .apply-card {
        background: rgba(10, 10, 10, 0.9);
        backdrop-filter: blur(25px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 40px;
        border-radius: 4px;
        max-width: 900px;
        width: 100%;
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
    }

    .apply-header {
        text-align: center;
        margin-bottom: 35px;
    }

    .apply-header h1 {
        font-family: 'Garamond', serif;
        font-size: 2.5rem;
        background: -webkit-linear-gradient(#fff, #888);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 10px;
    }

    .apply-header p {
        color: #888;
        font-size: 1rem;
        letter-spacing: 0.5px;
    }

    .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px 40px;
    }

    .input-group {
        margin-bottom: 20px;
    }

    .input-group label {
        display: block;
        color: #0072ff;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        font-weight: 700;
        margin-bottom: 8px;
    }

    .input-group input,
    .input-group textarea,
    .input-group select {
        width: 100%;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid #222;
        padding: 12px 16px;
        color: #fff;
        font-family: 'Inter', sans-serif;
        font-size: 0.95rem;
        border-radius: 2px;
        transition: all 0.3s;
    }

    .input-group input:focus,
    .input-group textarea:focus,
    .input-group select:focus {
        outline: none;
        border-color: #0072ff;
        background: rgba(255, 255, 255, 0.05);
    }

    .full-width {
        grid-column: span 2;
    }

    .submit-apply-btn {
        width: 100%;
        background: #0072ff;
        color: #fff;
        border: none;
        padding: 16px;
        font-size: 1rem;
        text-transform: uppercase;
        letter-spacing: 3px;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.3s;
        margin-top: 20px;
    }

    .submit-apply-btn:hover {
        background: #005bb5;
    }

    @media (max-width: 768px) {
        .form-grid {
            grid-template-columns: 1fr;
        }
        .full-width {
            grid-column: span 1;
        }
        .apply-card {
            padding: 30px 20px;
        }
    }
</style>

<div class="apply-container">
    <div class="apply-card fade-in">
        <div class="apply-header">
            <span class="infra-layer-badge" style="margin-bottom: 15px;"><i class="fas fa-graduation-cap"></i> KUSMUS ACADEMY</span>
            <h1>Academy Enrollment Profile</h1>
            <p>Define your professional trajectory. The Selection Committee evaluates based on ambition and sovereign technical potential.</p>
        </div>

        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="form-grid">
                <!-- Personal Info -->
                <div class="input-group">
                    <label for="name">Legal Full Name</label>
                    <input type="text" id="name" name="name" required placeholder="Real identity for certification">
                </div>

                <div class="input-group">
                    <label for="contact">Secure Contact (Email/Phone)</label>
                    <input type="text" id="contact" name="contact" required placeholder="director@institution.com or +234...">
                </div>

                <!-- Career State -->
                <div class="input-group">
                    <label for="career_goal">Path Orientation</label>
                    <select id="career_goal" name="career_goal" required>
                        <option value="Starting New">Starting a New Career Path</option>
                        <option value="Furthering Existing">Furthering an Existing Career</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="track">Preferred Training Track</label>
                    <select id="track" name="track" required>
                        <option value="" disabled selected>Select an option...</option>
                        <option value="ict_basics">1. Intro to ICT & Computing Basics</option>
                        <option value="web_dev">2. Full-Stack Web Development</option>
                        <option value="ai_python">3. Artificial Intelligence & Python</option>
                        <option value="ml_fundamentals">4. Machine Learning Fundamentals</option>
                        <option value="data_science">5. Data Science & Analytics</option>
                        <option value="cloud_ai">6. Cloud Computing & AI Deployment</option>
                        <option value="" disabled>──────────────────────────</option>
                        <option value="internship" style="color: #00ff88; font-weight: bold;">[+] Sovereign Innovators Internship</option>
                    </select>
                </div>

                <div class="input-group full-width">
                    <label for="institute">Parent Institute / Current Organization (Optional)</label>
                    <input type="text" id="institute" name="institute" placeholder="Organization name if applicable">
                </div>

                <!-- Experience -->
                <div class="input-group full-width">
                    <label for="experience">Professional/Academic Background</label>
                    <textarea id="experience" name="experience" rows="3" required placeholder="Briefly summarize your experience in engineering, logistics, finance, or marketing..."></textarea>
                </div>

                <!-- AI Ambition -->
                <div class="input-group full-width">
                    <label for="ai_ambition">Academy Ambition (What will you build with AI?)</label>
                    <textarea id="ai_ambition" name="ai_ambition" rows="4" required placeholder="Define the institutional value or autonomous ecosystem you intend to engineer after certification..."></textarea>
                </div>
            </div>

            <button type="submit" class="submit-apply-btn">Transmit Application &rarr;</button>
        </form>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const urlParams = new URLSearchParams(window.location.search);
        if(urlParams.get('type') === 'internship') {
            const trackSelect = document.getElementById('track');
            if(trackSelect) {
                trackSelect.value = 'internship';
            }
        }
    });
</script>
{% endblock %}
